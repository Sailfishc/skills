name: gates

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Gate tests
        run: python3 -m unittest discover -s tests
      - name: Decision records
        run: python3 skills/artifact-map/scripts/gates/check_decisions.py
      - name: Work directory
        run: python3 skills/artifact-map/scripts/gates/check_work.py
      - name: AGENTS.md budget
        run: python3 skills/artifact-map/scripts/gates/check_agents_budget.py
